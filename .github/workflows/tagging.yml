name: tagging
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  tagging:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Bump version and push tag
        uses: mathieudutour/github-tag-action@331898d5052eedac9b15fec867b5ba66ebf9b692 # v5.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: master
          tag_prefix: "v"